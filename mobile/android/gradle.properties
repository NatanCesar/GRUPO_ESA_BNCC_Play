# O template do Flutter pede -Xmx8G -XX:MaxMetaspaceSize=4G, o que trava
# maquinas de 8GB de RAM. Este projeto compila folgado dentro de 2G.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Nao deixa o daemon segurando RAM entre builds.
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
